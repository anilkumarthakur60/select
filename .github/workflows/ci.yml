name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build runs FIRST and must stay first: the Vue package's build invokes
      # scripts/check-dist.mjs, which mounts the emitted bundle. The unit suite
      # only ever compiles src, so a broken artifact is invisible to it — that
      # is exactly how a bundle compiled with the React JSX factory shipped
      # while all 125 tests were green.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build examples
        run: pnpm build:examples
